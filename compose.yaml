# Local test stack: docker compose up -d --build
#   App:      http://localhost:8080   (admin: admin@isp.test / Admin#12345)
#   Mailpit:  http://localhost:8025   (every email the app sends, e.g. 6-digit codes)
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: isp_automation
      DB_USERNAME: isp
      DB_PASSWORD: isp-secret
      QUEUE_CONNECTION: sync
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@isp.test
      ADMIN_EMAIL: admin@isp.test
      ADMIN_PASSWORD: "Admin#12345"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: isp_automation
      MYSQL_USER: isp
      MYSQL_PASSWORD: isp-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: during first-time setup MySQL answers on its
      # socket before it accepts network connections.
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-uisp", "-pisp-secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  db-data:
