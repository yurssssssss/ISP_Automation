# Local test stack: docker compose up -d --build
#   App:      http://localhost:8080   (admin: admin@isp.test / Admin#12345)
#   Mailpit:  http://localhost:8025   (every email the app sends, e.g. 6-digit codes)
#   scheduler + queue run the billing automation (reminders, cut-offs, reconnects).

# Shared by the web app and its two background services. Test values only —
# never reuse this APP_KEY or these passwords on a live server.
x-app: &app
  build: .
  environment: &app-env
    APP_ENV: local
    APP_DEBUG: "true"
    APP_KEY: "base64:OEvZNovHEi53v9++AOQn32RG317zbOtGI1TsNTiNUQI="
    APP_URL: http://localhost:8080
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: isp_automation
    DB_USERNAME: isp
    DB_PASSWORD: isp-secret
    QUEUE_CONNECTION: database
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    MAIL_FROM_ADDRESS: no-reply@isp.test
    ADMIN_EMAIL: admin@isp.test
    ADMIN_PASSWORD: "Admin#12345"
  restart: unless-stopped

services:
  app:
    <<: *app
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  # Runs the daily billing tasks (routes/console.php) and the heartbeat the
  # dashboard checks.
  scheduler:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy

  # Pushes cut / reconnect changes to the MikroTik and sends the emails.
  queue:
    <<: *app
    environment:
      <<: *app-env
      CONTAINER_ROLE: worker
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=30"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: isp_automation
      MYSQL_USER: isp
      MYSQL_PASSWORD: isp-secret
      MYSQL_ROOT_PASSWORD: root-secret
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # TCP, not the socket: during first-time setup MySQL answers on its
      # socket before it accepts network connections.
      test: ["CMD", "mysqladmin", "ping", "--protocol=tcp", "-h", "127.0.0.1", "-uisp", "-pisp-secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  db-data:
